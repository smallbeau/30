[project]
name = "voice-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "openai>=1.50.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "edge-tts>=6.1.0",
  "numpy>=1.26.0",
  "websockets>=13.0",
  "jieba>=0.42.1",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=3.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]